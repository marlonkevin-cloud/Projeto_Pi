{% extends 'base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
    <h1>Excluir Tarefa</h1>
    <p>Tem certeza que deseja excluir a tarefa "<strong>{{ tarefa.titulo }}</strong>"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirmar Exclusão</button>
        <a href="{% url 'core:listar_tarefas' %}">Cancelar</a>
    </form>
{% endblock %}
