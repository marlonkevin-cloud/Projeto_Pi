{% extends 'base.html' %}

{% block title %}Cadastrar Tarefa{% endblock %}

{% block content %}
    <h1>Gerenciar Tarefa</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <a href="{% url 'core:listar_tarefas' %}">Voltar</a>
{% endblock %}
